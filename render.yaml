# Render Blueprint (optional): static site + SPA fallback so /portal/* reloads work.
# If the static site already exists in the dashboard, sync this file or add the same rule manually:
#   Redirects/Rewrites → Source: /* → Destination: /index.html → Action: Rewrite
#
# Adjust `name` if yours differs (e.g. marketing.shyara-frontend).
version: "1"
services:
  - type: web
    name: marketing.shyara-frontend
    runtime: static
    buildCommand: npm install && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    # Static files under /samples/ (posters + sample SPAs) must be served as-is.
    # Render serves matching files before rewrites; this documents the intent.
    routes:
      - type: rewrite
        source: /samples/websites/car-wash-auto-care-website/*
        destination: /samples/websites/car-wash-auto-care-website/index.html
      - type: rewrite
        source: /samples/websites/gym-ironforge-website/*
        destination: /samples/websites/gym-ironforge-website/index.html
      - type: rewrite
        source: /samples/websites/yoga-ananda-website/*
        destination: /samples/websites/yoga-ananda-website/index.html
      - type: rewrite
        source: /samples/websites/restaurant-fire-town-website/*
        destination: /samples/websites/restaurant-fire-town-website/index.html
      - type: rewrite
        source: /*
        destination: /index.html
