<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shyara OG</title>
    <style>
      @font-face {
        font-family: "Tan Paradiso";
        src: url("../src/assets/fonts/TAN-PARADISO.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f0eee9;
        font-family: "Cabinet Grotesk", "Segoe UI", system-ui, sans-serif;
      }

      .frame {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 56px;
        background:
          radial-gradient(circle at 88% 18%, rgba(255, 51, 51, 0.14), transparent 34%),
          #f0eee9;
      }

      .card {
        position: relative;
        display: flex;
        height: 100%;
        flex-direction: column;
        justify-content: space-between;
        border: 4px solid #0a0a0a;
        background: #ffffff;
        padding: 64px 72px;
        box-shadow: 14px 14px 0 #0a0a0a;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 2px solid #0a0a0a;
        background: #ffffff;
        padding: 10px 18px;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .badge-dot {
        width: 10px;
        height: 10px;
        background: #ff3333;
      }

      .logo {
        font-family: "Tan Paradiso", Georgia, serif;
        font-size: 148px;
        line-height: 0.92;
        letter-spacing: 0.02em;
        color: #0a0a0a;
      }

      .logo span {
        color: #ff3333;
      }

      .tagline {
        max-width: 720px;
        font-size: 42px;
        font-weight: 900;
        line-height: 1.05;
        letter-spacing: -0.03em;
        color: #0a0a0a;
      }

      .tagline em {
        font-style: normal;
        color: #ff3333;
      }

      .accent {
        position: absolute;
        right: 72px;
        top: 64px;
        font-size: 88px;
        font-weight: 900;
        color: #ff3333;
        line-height: 1;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 2px solid rgba(10, 10, 10, 0.12);
        padding-top: 28px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(10, 10, 10, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">
        <span class="accent" aria-hidden="true">✱</span>
        <div class="badge"><span class="badge-dot"></span> Shyara Marketing</div>
        <div>
          <div class="logo">SHYARA<span>.</span></div>
          <p class="tagline">Websites that <em>work.</em></p>
        </div>
        <div class="footer">
          <span>marketing.shyara.co.in</span>
          <span>India</span>
        </div>
      </div>
    </div>
  </body>
</html>
