name: Schema Drift Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prisma-drift-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run backend:prisma:generate

      - name: Check migrations match schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=deploy_check
        run: |
          npx prisma migrate deploy --schema backend/prisma/schema.prisma
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel backend/prisma/schema.prisma \
            --exit-code
